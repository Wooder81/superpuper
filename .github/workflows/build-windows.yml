name: Build GAZYAVA (Windows VST3)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: msbuild build/GAZYAVA.sln /p:Configuration=Release /m
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $found = Get-ChildItem -Path build -Recurse -Directory -Filter *.vst3
          $found | ForEach-Object { Write-Host «FOUND: $($_.FullName)» }
          $found | ForEach-Object { Copy-Item -Recurse $_.FullName dist/ }
      - uses: actions/upload-artifact@v4
        with:
          name: GAZYAVA-VST3-Windows
          path: dist/
